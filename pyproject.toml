[project]
name = "elegant-parrot"
version = "0.1.0"
description = "System-wide spelling/grammar correction (EN, FR, Darija) with a PII gate in front of local or external models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Saad Hassouane"}]
keywords = ["grammar", "spellcheck", "pii", "gdpr", "privacy", "ollama", "darija", "hotkey"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]   # pii_gate core: nothing else

[project.urls]
Homepage = "https://github.com/saad-hassouane/elegant-parrot"
Issues = "https://github.com/saad-hassouane/elegant-parrot/issues"

[project.optional-dependencies]
ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]
corrector = ["httpx>=0.27", "tomlkit>=0.12"]
desktop = ["pynput>=1.7"]          # `elegant-parrot listen`: global hotkey on Linux/macOS/Windows
dev = ["pytest>=8"]

[project.scripts]
pii-gate-server = "pii_gate.server:main"
elegant-parrot = "corrector.ctl:main"
pii-correct = "corrector.cli:main"
pii-hotkey = "corrector.hotkey:main"

[tool.setuptools]
packages = ["pii_gate", "corrector", "corrector.osdep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
